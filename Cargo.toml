[package]
name = "cargo-broom"
version = "0.1.0"
edition = "2024"
# 1.89 for std::fs::File::{try_lock,unlock} (running-build detection in discover.rs),
# avoids pulling in a file-locking crate for one narrow check.
rust-version = "1.89"
description = "Conservative Cargo build-artifact cleaner for one or many Rust projects"
license = "MIT"
readme = "README.md"
repository = "https://github.com/casoon/broom"
keywords = ["cargo-plugin", "clean", "sweep", "target", "disk-space"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[lib]
name = "broom"
path = "src/lib.rs"

[[bin]]
name = "cargo-broom"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cargo_metadata = "0.19"
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
runemark = { version = "0.2.0", features = ["progress"] }
dialoguer = "0.11"
trash = "5.2.6"

[dev-dependencies]
filetime = "0.2.29"
